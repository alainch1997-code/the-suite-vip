<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="The Suite"/>
  <meta name="theme-color" content="#f4f0f8"/>
  <title>The Suite by ABC - VIP Booking Dashboard</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23582c83'/><text x='50%' y='68%' font-size='60' font-weight='bold' fill='%23ffffff' text-anchor='middle'>S</text></svg>"/>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: #f4f0f8; 
      color: #2c2a2e; 
      margin: 0; 
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px; 
      font-size: 15px; 
      line-height: 1.4;
      -webkit-user-select: none;
      user-select: none;
    }

    .header { text-align: center; padding: 12px 0 18px; border-bottom: 1px solid #e2d9eb; margin-bottom: 16px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #582c83; margin: 0 0 2px 0; letter-spacing: 1px; }
    .header p { font-size: 11px; color: #7a6e85; margin: 0; text-transform: uppercase; letter-spacing: 1.5px; }
    
    .card { background: #ffffff; border: 1px solid #e6def0; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(88, 44, 131, 0.05); }
    .card h2 { font-size: 14px; color: #582c83; margin: 0 0 12px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between; }
    
    label { display: block; font-size: 11px; color: #6b5b7b; text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 4px; font-weight: 700; }
    label:first-of-type { margin-top: 0; }
    
    input, select { 
      width: 100%; height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #dcd1e8; background: #fbf9fc; color: #2c2a2e; font-size: 15px; outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; 
    }
    input:focus, select:focus { border-color: #582c83; background: #fff; }
    
    .select-wrapper { position: relative; }
    .select-wrapper::after { content: "▼"; font-size: 10px; color: #582c83; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }

    .btn { 
      width: 100%; height: 48px; border-radius: 12px; border: none; background: #582c83; color: #ffffff; font-size: 14px; font-weight: 700; margin-top: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(88, 44, 131, 0.2); 
    }
    .btn:active { background: #421d66; transform: scale(0.98); }
    .btn-secondary { background: #efe6f7; color: #582c83; border: 1px solid #d4c2e5; box-shadow: none; }
    
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; margin-top: 10px; }
    
    .booking-card { background: #fbf9fc; border-radius: 12px; padding: 14px; margin-top: 10px; border-left: 4px solid #582c83; border-top: 1px solid #efe8f5; border-right: 1px solid #efe8f5; border-bottom: 1px solid #efe8f5; display: flex; justify-content: space-between; align-items: center; }
    .booking-info { flex: 1; min-width: 0; }
    .booking-time { font-size: 15px; font-weight: 700; color: #582c83; margin-bottom: 2px; }
    .booking-name { font-size: 14px; color: #2c2a2e; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .booking-phone { font-size: 13px; color: #8c1d40; text-decoration: none; display: inline-block; font-weight: 600; }
    .booking-meta { font-size: 11px; color: #7a6e85; margin-top: 4px; text-transform: uppercase; }
    
    .action-group { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; margin-left: 10px; flex-shrink: 0; }
    .btn-delete { background: rgba(157, 34, 53, 0.1); color: #9d2235; border: 1px solid rgba(157, 34, 53, 0.3); border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
    
    .empty-state { text-align: center; color: #8e809a; font-size: 13px; padding: 20px 0; font-style: italic; }
    .badge { background: rgba(88, 44, 131, 0.1); color: #582c83; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .export-modal { background: #f8f4fb; border: 1px solid #e6def0; border-radius: 12px; padding: 14px; margin-top: 10px; }
    .summary-box { background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #e2d9eb; margin-top: 10px; font-size: 13px; color: #582c83; font-weight: 600; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="header">
    <h1>THE SUITE</h1>
    <p>ABC Store &bull; VIP Dashboard</p>
  </div>

  <div class="card">
    <h2>Shift & Schedule <span class="badge" id="slotCountBadge">Loading...</span></h2>
    <label>Consultant On Duty</label>
    <div class="select-wrapper">
      <select id="consultant">
        <option value="Alain">Alain</option>
        <option value="Raneem">Raneem</option>
      </select>
    </div>
    <label>Shift Mode Today</label>
    <div class="select-wrapper">
      <select id="shift">
        <option value="9-17">9:00 AM – 5:00 PM</option>
        <option value="12-20" selected>12:00 PM – 8:00 PM</option>
        <option value="10-18">10:00 AM – 6:00 PM</option>
        <option value="14-22">2:00 PM – 10:00 PM</option>
        <option value="off">Suite Closed / Off Day</option>
      </select>
    </div>
    <label>Date</label>
    <input type="date" id="bookingDate" />
  </div>

  <div class="card">
    <h2>Book VIP Appointment</h2>
    <label>Client Full Name</label>
    <input type="text" id="clientName" placeholder="e.g. Maya Khoury" autocomplete="off" />
    <label>Client Phone Number</label>
    <input type="tel" id="clientPhone" placeholder="e.g. +961 70 123 456" autocomplete="off" />
    <label>Available Time Slot</label>
    <div class="select-wrapper">
      <select id="timeSlot"></select>
    </div>
    <button class="btn" id="confirmBtn">Confirm VIP Booking</button>
  </div>

  <div class="card">
    <h2>Confirmed Bookings</h2>
    <div id="bookingList"></div>
  </div>

  <div class="card">
    <h2>Reports & Export</h2>
    <div class="export-modal">
      <div class="summary-box" id="reportSummary">Tap Calculate Summary to view totals.</div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="summaryBtn">Summary</button>
        <button class="btn" id="exportCsvBtn">📊 CSV</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vfwitbvxflshpzqmyhvwl.supabase.co/rest/v1/bookings';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmd2l0YnZ4ZnNocHpxbXlodndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODM4MjksImV4cCI6MjEwMzA1OTgyOX0.wFvFMC6TpKGQLrj89fYC2eztXtnX4tE-NRZ1KcTpKPs';

    let bookings = [];
    const bookingDateInput = document.getElementById('bookingDate');
    bookingDateInput.value = new Date().toISOString().split('T')[0];

    async function loadBookings() {
      try {
        const res = await fetch(`${SUPABASE_URL}?select=*`, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (res.ok) {
          bookings = await res.json();
          renderBookings();
          updateSlots();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function updateSlots() {
      const shiftVal = document.getElementById('shift').value;
      const selectedDate = bookingDateInput.value;
      const slotSelect = document.getElementById('timeSlot');
      const badge = document.getElementById('slotCountBadge');
      
      slotSelect.innerHTML = '';
      if (shiftVal === 'off') {
        slotSelect.innerHTML = '<option value="">Suite Closed</option>';
        badge.textContent = 'Closed';
        return;
      }

      const [startHour, endHour] = shiftVal.split('-').map(Number);
      let availableCount = 0;

      for (let h = startHour; h < endHour; h++) {
        let displayHour = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        let ampm = h >= 12 ? 'PM' : 'AM';
        let timeStr = `${displayHour}:00 ${ampm}`;
        let rawTime = (h < 10 ? '0' : '') + h + ':00';

        let isBooked = Array.isArray(bookings) && bookings.some(b => b.date === selectedDate && b.raw_time === rawTime);
        
        if (!isBooked) {
          let opt = document.createElement('option');
          opt.value = rawTime;
          opt.setAttribute('data-display', timeStr);
          opt.textContent = timeStr + ' - Available';
          slotSelect.appendChild(opt);
          availableCount++;
        }
      }

      if (availableCount === 0) {
        slotSelect.innerHTML = '<option value="">Fully Booked</option>';
      }
      badge.textContent = availableCount + ' Open Slots';
    }

    function renderBookings() {
      const list = document.getElementById('bookingList');
      const selectedDate = bookingDateInput.value;
      const filtered = Array.isArray(bookings) ? bookings.filter(b => b.date === selectedDate) : [];

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">No appointments booked for this date.</div>';
        return;
      }

      filtered.sort((a, b) => (a.raw_time || '').localeCompare(b.raw_time || ''));
      list.innerHTML = '';
      
      filtered.forEach(b => {
        const card = document.createElement('div');
        card.className = 'booking-card';
        card.innerHTML = `
          <div class="booking-info">
            <div class="booking-time">${b.time_display}</div>
            <div class="booking-name">${escapeHtml(b.name)}</div>
            <a href="tel:${escapeHtml(b.phone)}" class="booking-phone">📞 ${escapeHtml(b.phone)}</a>
            <div class="booking-meta">Consultant: ${escapeHtml(b.consultant)}</div>
          </div>
          <div class="action-group">
            <button class="btn-delete" onclick="deleteBooking(${b.id})">Cancel</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function addBooking() {
      const name = document.getElementById('clientName').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();
      const timeSelect = document.getElementById('timeSlot');
      const rawTime = timeSelect.value;
      
      if (!rawTime || !name || !phone) {
        alert('Please fill in all fields.');
        return;
      }

      const selectedOpt = timeSelect.options[timeSelect.selectedIndex];
      const timeDisplay = selectedOpt ? selectedOpt.getAttribute('data-display') || rawTime : rawTime;

      const newBooking = { 
        id: Date.now(), 
        name, 
        phone, 
        raw_time: rawTime, 
        time_display: timeDisplay, 
        date: bookingDateInput.value, 
        consultant: document.getElementById('consultant').value 
      };

      try {
        const res = await fetch(SUPABASE_URL, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(newBooking)
        });

        if (res.ok) {
          document.getElementById('clientName').value = '';
          document.getElementById('clientPhone').value = '';
          loadBookings();
        } else {
          alert('Could not save booking');
        }
      } catch (e) {
        alert('Error saving booking');
      }
    }

    async function deleteBooking(id) {
      if (confirm('Cancel this VIP booking?')) {
        try {
          const res = await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
            method: 'DELETE',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });
          if (res.ok) loadBookings();
        } catch (e) {
          alert('Error deleting booking.');
        }
      }
    }

    function calculateSummary() {
      const filtered = Array.isArray(bookings) ? bookings : [];
      const alainCount = filtered.filter(b => b.consultant === 'Alain').length;
      const raneemCount = filtered.filter(b => b.consultant === 'Raneem').length;
      
      document.getElementById('reportSummary').innerHTML = `
        <strong>Total Appointments:</strong> ${filtered.length}<br>
        &bull; Alain: ${alainCount} bookings<br>
        &bull; Raneem: ${raneemCount} bookings
      `;
    }

    function exportCSV() {
      if (!Array.isArray(bookings) || bookings.length === 0) {
        alert('No bookings available to export.');
        return;
      }

      let csv = 'ID,Date,Time,Client Name,Phone,Consultant\n';
      bookings.forEach(b => {
        csv += `"${b.id}","${b.date}","${b.time_display}","${(b.name || '').replace(/"/g, '""')}","${b.phone}","${b.consultant}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.download = `The_Suite_Bookings_Report_${Date.now()}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeHtml(text) { return text ? String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    bookingDateInput.addEventListener('change', () => { updateSlots(); renderBookings(); });
    document.getElementById('shift').addEventListener('change', updateSlots);
    document.getElementById('confirmBtn').addEventListener('click', addBooking);
    document.getElementById('summaryBtn').addEventListener('click', calculateSummary);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);

    loadBookings();
    setInterval(loadBookings, 3000);
  </script>
</body>
</html>
